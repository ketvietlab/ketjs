name: node.js security releases

# Fails when .nvmrc misses a security release of its Node.js line or names an unsupported line.
# engines.node findings are warnings; see tools/node-security.mjs. A security release can land on
# any day, so the check also runs on a schedule and keeps one open issue while it fails.

on:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
    branches: [integration, develop, master]
    paths:
      - .nvmrc
      - package.json
      - packages/*/package.json
      - tools/node-security*.mjs
      - .github/workflows/node-security.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: node.js security releases
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && 'kv-ci' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: checker contracts
        run: node --test tools/node-security.test.mjs
      - name: compare .nvmrc and engines with Node.js releases
        id: check
        run: node tools/node-security.mjs 2>&1 | tee node-security.txt
        shell: bash -o pipefail {0}
      - name: open or update the tracking issue
        if: failure() && steps.check.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title='Node.js security check is failing'
          body="$(printf 'The scheduled check failed on %s.\n\n```text\n%s\n```\n\nRun: %s\n\nMove `.nvmrc` to the version named above, or fix what the error names; see `tools/node-security.mjs`.' "$(date -u +%F)" "$(cat node-security.txt)" "$RUN_URL")"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
