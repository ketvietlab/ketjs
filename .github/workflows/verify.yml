name: verify

on:
  # Two pull requests carry the full suite: the promotion of integration into
  # develop, and the release into master. Integration takes merges on local
  # evidence alone, so the promotion is the first place a test another branch
  # left stale can show. Other pull requests into develop carry no CI: whoever
  # changes a part runs that part's tests locally (AGENTS.md).
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality contracts
    if: github.event_name != 'pull_request' || github.base_ref == 'master' || github.head_ref == 'integration'
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && 'kv-ci' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: VERSION is the only version source
        run: npm run version:check
      - name: version changes include audited documentation and lab evidence
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: node tools/version-audit.mjs gate "$BASE_COMMIT"
      - name: formatting is what the formatter would write
        uses: ./.github/actions/task-cache
        with:
          task: format
      - name: build cache invalidation contract
        uses: ./.github/actions/task-cache
        with:
          task: unit-cache
      - name: lint
        uses: ./.github/actions/task-cache
        with:
          task: lint
      - name: the words are the ones the glossary settled on
        run: npm run audit:terminology
      - name: build with shared artifact cache
        uses: ./.github/actions/build
      - name: dependencies stay where they are declared
        run: node .build/tools/zero-dep-audit.js
      - name: types check
        uses: ./.github/actions/task-cache
        with:
          task: types

  tests:
    name: tests
    needs: [quality]
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && 'kv-ci' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: ketjs_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build
      - name: run the framework suite against a real Postgres
        env:
          DATABASE_URL: postgres://dev:devpassword@127.0.0.1:5432/ketjs_ci
        run: npm run test:built
