# The full suite runs here, not on a laptop.
#
# Locally the useful loop is "test what you just wrote"; running 380 tests to
# check a twenty-line change is a tax paid on every iteration for a signal that
# arrives once. So the whole of it — the dependency audit, the type check, every
# test, and the type-level assertions — belongs on the way into develop, where it
# is paid once per pull request and blocks the merge rather than the author.
name: verify

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push supersedes the run it interrupts: the older answer is about code
# nobody is merging any more.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to what the framework actually claims: TypeScript runs natively,
      # so an older Node does not merely warn here, it cannot parse the source.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: start a real S3-compatible server
        run: |
          docker run -d --name ketjs-minio -p 19000:9000 \
            -e MINIO_ROOT_USER=ketjsminio \
            -e MINIO_ROOT_PASSWORD=ketjsminiosecret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:19000/minio/health/live && exit 0
            sleep 1
          done
          docker logs ketjs-minio
          exit 1

      # Each step separately, so a red build says which contract broke rather
      # than that something did.
      #
      # These mirror `npm run verify`, the gate AGENT.md points contributors at.
      # They used to be a shorter list, so a change that broke formatting, lint or
      # one of the audits merged green and only turned red on the next
      # contributor's machine — which is where it was found, twice.
      - name: formatting is what the formatter would write
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: the words are the ones the glossary settled on
        run: npm run audit:terminology

      - name: dependencies stay where they are declared
        run: npm run audit:zero-dep

      - name: no module writes its own markup
        run: npm run audit:ui

      # The checked-in document is what SDK generators and external callers read.
      # Regenerating it was a side effect of building the docs site, so a route
      # added without one merged green and the document quietly fell behind —
      # which it had, by three routes, before anyone looked.
      - name: staff routes answer within their session's permissions
        run: npm run audit:staff-channel

      - name: the published Channel API documents match the server
        run: npm run check:api

      - name: types check
        run: npm run check

      - name: tests
        run: npm test

      - name: the type-level claims still hold
        run: npm run type-proof

  # Postgres is the adapter that catches what SQLite cannot: placeholder
  # rendering, NUMERIC round-trips, and the reserved words only it has.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: ketjs_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: tests against a real Postgres
        env:
          DATABASE_URL: postgres://dev:devpassword@127.0.0.1:5432/ketjs_ci
        run: npm test
