name: verify

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan test groups
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      has_groups: ${{ steps.groups.outputs.has_groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - id: groups
        name: select groups affected by this diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci-test-groups.mjs plan "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  quality:
    name: quality contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: formatting is what the formatter would write
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: the words are the ones the glossary settled on
        run: npm run audit:terminology
      - name: build
        run: npm run build --silent
      - name: dependencies stay where they are declared
        run: node .build/tools/zero-dep-audit.js
      - name: no module writes its own markup
        run: node .build/tools/ui-audit.js
      - name: staff routes answer within their session's permissions
        run: npm run audit:staff-channel
      - name: the published Channel API documents match the server
        run: npm run check:api
      - name: architecture examples name their source location
        run: npm --prefix docs run check:snippets
      - name: types check
        run: npm run check
      - name: the type-level claims still hold
        run: node .build/tools/type-proof.js

  tests:
    name: sqlite / ${{ matrix.group }}
    needs: [plan, quality]
    if: needs.plan.outputs.has_groups == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: start a real S3-compatible server
        if: matrix.group == 'framework'
        run: |
          docker run -d --name ketjs-minio -p 19000:9000 \
            -e MINIO_ROOT_USER=ketjsminio \
            -e MINIO_ROOT_PASSWORD=ketjsminiosecret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:19000/minio/health/live && exit 0
            sleep 1
          done
          docker logs ketjs-minio
          exit 1
      - run: npm run build --silent
      - name: run selected tests
        run: npm run test:group:built -- ${{ matrix.group }}

  postgres:
    name: postgres / ${{ matrix.group }}
    needs: [plan, quality]
    if: needs.plan.outputs.has_groups == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: ketjs_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: run selected tests against a real Postgres
        env:
          DATABASE_URL: postgres://dev:devpassword@127.0.0.1:5432/ketjs_ci
        run: npm run test:group:built -- ${{ matrix.group }}
