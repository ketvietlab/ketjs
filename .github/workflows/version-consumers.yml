name: version documentation and labs

on:
  pull_request:
    branches: [integration, develop, master]
    paths:
      - VERSION
      - CHANGE_LOG
      - tools/version*.mjs
      - tools/release-files.mjs
      - .github/workflows/version-consumers.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-consumers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumers:
    name: version audit and consumer checks
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && 'kv-ci' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # A pull request that changes VERSION or CHANGE_LOG must carry current evidence,
      # and its consumers are rerun against the candidate tarballs. One that changes
      # only the version tooling runs the tooling contracts: between releases the
      # published version's evidence and candidate locks are stale by design, and the
      # next version pull request reruns everything.
      - name: reject missing commits, reasons, audits and stale evidence
        id: audit
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run version:check
          node tools/version-audit.mjs gate "$BASE_COMMIT"
          echo "required=$(node tools/version-audit.mjs required "$BASE_COMMIT")" >> "$GITHUB_OUTPUT"
      - name: version and audit failure contracts
        run: node --test tools/version.test.mjs
      - name: rerun documentation and downloadable labs against candidate tarballs
        if: steps.audit.outputs.required == 'true'
        run: npm run version:consumers
      - name: retain audit reports and executable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-consumer-evidence
          path: .artifacts/version-audit/
          if-no-files-found: warn
