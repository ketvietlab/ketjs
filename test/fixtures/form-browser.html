<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Form adapter contract fixture</title>
<h1>Form adapter contract fixture</h1>
<p>This fixture exercises native controls; its transport simulates server outcomes.</p>
<label>Other draft <input id="other" value="keep this draft"></label>
<form id="edit" method="post">
  <label for="name">Name</label><input id="name" name="name" aria-describedby="name-hint">
  <p id="name-hint">Use reject to exercise server issues, or lost to retry an uncertain save.</p>
  <p id="name-error" data-form-error="name"></p>
  <label for="note">Note</label><textarea id="note" name="note"></textarea>
  <p id="note-error" data-form-error="note"></p>
  <label for="alias-one">First alias</label><input id="alias-one" name="aliases">
  <label for="alias-two">Second alias</label><input id="alias-two" name="aliases">
  <label><input type="checkbox" name="active" id="active">Active</label>
  <label for="tags">Tags</label><select id="tags" name="tags" multiple><option value="a">A</option><option value="b">B</option></select>
  <label>Read only <input name="ignored" value="untouched" disabled></label>
  <fieldset disabled><legend>Protected section</legend><label for="protected-tags">Protected tags</label><select id="protected-tags" name="protectedTags" multiple><option value="safe">Safe</option></select></fieldset>
  <p data-form-summary role="alert"></p>
  <button type="reset">Reset</button>
</form>
<button id="save" form="edit" type="submit" name="command" value="save">Save or retry</button>
<button id="archive" form="edit" type="submit" name="command" value="archive">Archive</button>
<input id="publish" form="edit" type="submit" name="command" value="publish" aria-label="Publish">
<button id="detach" type="button">Detach adapter</button>
<pre id="state" role="status"></pre>
<script type="module">
import { defineFormContract, createFormSession, attachForm, effect, validationIssue } from '/view/index.js'
const contract = defineFormContract('fixture.v1', { fields: {
  name: { required: true, trim: true }, note: { nullable: true, empty: 'null', required: true },
  active: { type: 'bool', required: true }, tags: { type: 'array', required: true, items: { required: true } }, protectedTags: { type: 'array', required: true, items: { required: true } },
  aliases: { required: true, multiple: true }, command: { required: true, oneOf: ['save', 'archive', 'publish'] },
} })
let calls = 0
let parentSubmits = 0
let detached = false
const receipts = new Map()
const session = createFormSession(contract, {
  recordId: 'p1', revision: 'r0', initial: { name: 'Tea', note: null, active: true, tags: ['a', 'b'], protectedTags: ['safe'], aliases: ['alpha', 'beta'], command: 'save' },
  transport: async (request) => {
    calls++
    if (receipts.has(request.mutationId)) return receipts.get(request.mutationId)
    await new Promise((resolve) => setTimeout(resolve, 250))
    if (request.values.name === 'reject') return { status: 'invalid', issues: [validationIssue('name', 'taken'), validationIssue('name', 'reserved'), validationIssue('note', 'note_refused')] }
    const receipt = { status: 'committed', accepted: { ...request.values, name: request.values.name.toUpperCase() }, revision: 'r1', value: {} }
    receipts.set(request.mutationId, receipt)
    if (request.values.name === 'lost') throw new Error('response lost')
    return receipt
  },
})
document.addEventListener('submit', () => { parentSubmits++ })
const detach = attachForm(document.getElementById('edit'), session, { formatIssue: (issue) => issue.code, onOutcome: () => queueMicrotask(render) })
const render = () => {
  document.getElementById('state').textContent = JSON.stringify({ status: session.status(), values: session.values(), dirty: session.dirty(), calls, intents: receipts.size, focused: document.activeElement?.id, parentSubmits, detached })
}
effect(render)
document.getElementById('detach').addEventListener('click', () => { detach(); detached = true; render() })
</script>
</html>
